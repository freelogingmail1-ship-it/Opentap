<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14151a;--mu:#7b7f8c;--bd:#ececf2;--sh:0 8px 28px rgba(30,30,80,.08);--ac:linear-gradient(135deg,#ff8a3d,#ff2e7e 50%,#7b3fe4);--bl:#1d9bf0}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:110px}
svg{display:block;flex:none}
.logo{font-weight:800;font-size:25px;letter-spacing:-.5px;background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;top:0;z-index:5;transition:transform .3s ease;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.ib{background:var(--card);color:var(--tx);border:1px solid var(--bd);width:40px;height:40px;border-radius:14px;padding:0;display:grid;place-items:center;box-shadow:var(--sh)}

button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.p{background:none;color:var(--tx);padding:6px;border-radius:10px;display:flex;align-items:center;gap:6px}
input,textarea{font:inherit;width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0;outline:none}
input:focus,textarea:focus{border-color:#ff2e7e}
.mu{color:var(--mu);font-size:12.5px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--bd)}
.av.sm{width:32px;height:32px}.rb{display:none;padding:6px 4px 0;font-size:13px;color:var(--mu)}.rb b{color:var(--tx)}
.av.big{width:96px;height:96px}
.ring{display:block;border-radius:50%}
.nm{font-weight:700;display:flex;align-items:center;gap:2px}
.post{background:var(--card);margin:0 12px 16px;border-radius:24px;box-shadow:var(--sh);overflow:hidden;padding-bottom:6px}
.ph{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.mw{margin:0 10px;border-radius:18px;overflow:hidden;background:#000}
.media{width:100%;max-height:640px;object-fit:contain;display:block}
.act{display:flex;align-items:center;gap:4px;padding:8px 10px 2px}.act .mu{margin-left:auto;padding-right:6px}
.cap{padding:2px 16px 10px}
.empty{text-align:center;padding:60px 30px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:18px;margin:12px 0 4px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 24px));display:flex;justify-content:space-around;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:28px;padding:8px 6px;box-shadow:var(--sh);z-index:9}

nav button.on{color:#ff2e7e;background:color-mix(in srgb,#ff2e7e 13%,transparent)}
nav button.add{background:var(--ac);color:#fff;padding:12px 16px;border-radius:18px;box-shadow:0 6px 18px rgba(255,46,126,.4)}nav button.add::after{display:none}

.pad{padding:6px 16px}.auth{padding:70px 26px;text-align:center;background:radial-gradient(circle at 20% 0,#ff8a3d33,transparent 45%),radial-gradient(circle at 90% 10%,#7b3fe433,transparent 40%);min-height:100vh}

.pcard{background:var(--card);margin:6px 12px 14px;border-radius:26px;box-shadow:var(--sh);padding:26px 18px 18px;text-align:center}
.sd{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;border:0;padding:0;display:grid;place-items:center;flex:none}.cb{width:44px;height:44px;padding:0;display:grid;place-items:center;background:none;color:var(--mu);border-radius:50%;flex:none}.dlb{background:rgba(0,0,0,.2);color:inherit;padding:4px 10px;border-radius:12px;font-size:12px;display:inline-flex;align-items:center;gap:5px;margin-top:6px}
.ta{min-height:44px;resize:none;max-height:120px;margin:0;border-radius:22px;line-height:1.35;overflow-y:auto;padding:11px 16px;display:block}.cin{display:flex;gap:8px;align-items:flex-end;padding-top:10px}.cin .ta{flex:1}
.stats{display:flex;gap:10px;margin:14px 0}.stats>div{flex:1;background:var(--bg);border-radius:16px;padding:10px}.stats b{font-size:17px;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 12px}.grid>div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bd)}.grid img,.grid video{width:100%;height:100%;object-fit:cover}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:20px;margin:0 12px 10px;box-shadow:var(--sh);cursor:pointer}
.bub{white-space:pre-wrap;max-width:78%;padding:9px 14px;border-radius:20px;margin:4px 0;word-break:break-word;width:fit-content}
.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:6px}.th{background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.bub img,.bub video{max-width:100%;border-radius:12px;display:block}.bub audio{max-width:230px}
.sheet{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:auto;max-height:80vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px}
.sheet>div.cmt{height:72vh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom))}.cmt .cl{flex:1;overflow-y:auto;min-height:0;margin:10px 0}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card);box-shadow:0 8px 30px #0005;padding:12px 18px;border-radius:16px;z-index:60;display:none;max-width:90%;font-weight:600}
.od{width:9px;height:9px;border-radius:50%;background:#2ecc71;display:inline-block;margin-right:4px}.od.off{background:#9a9aa5}
.sw{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;gap:12px}.sw+.sw{border-top:1px solid var(--bd)}
.grp{background:var(--card);border-radius:22px;box-shadow:var(--sh);margin:0 12px 14px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--bd);position:relative;padding:0;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0004}
.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.rx{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--card);border-radius:30px;box-shadow:0 10px 40px #0006;padding:8px 12px;display:flex;gap:6px;z-index:40}.rx button{background:none;font-size:28px;padding:4px 7px}
.chatbar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:9}
.chatbar>div{display:flex;max-width:520px;margin:auto;gap:6px;align-items:flex-end}
</style></head><body>

const mem={};const LS={getItem:k=>{try{return localStorage.getItem(k)}catch{return mem[k]??null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}},removeItem:k=>{try{localStorage.removeItem(k)}catch{delete mem[k]}}};

const ic=(n,s=22,f='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const BP='M'+[...Array(160)].map((_,i)=>{const t=i*2*Math.PI/160-Math.PI/2,r=9.5+1.6*Math.abs(Math.cos(4*t));return (12+r*Math.cos(t)).toFixed(2)+' '+(12+r*Math.sin(t)).toFixed(2)}).join('L')+'Z';
const bd=(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="margin-left:4px;flex:none"><path fill="#0095f6" d="${BP}"/><path d="M7.8 12.4l3 3 5.6-6.2" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const vb=(p,s=16)=>p&&p.verified?bd(s):'';
const nm=p=>e((p?.full_name||'').trim()||p?.username||'User');

const av=(p,c='')=>`<img class="av ${c}" src="${e(p?.avatar_url)||DEF}" onerror="this.src='${DEF}'">`;

const PM={},NM={};let curPost=0,replyTo=null;const reg=p=>(PM[p.id]=p,p.id);
let me,prof,tab='feed',chan=[],unread=0,chatWith=null;
document.documentElement.dataset.theme=LS.getItem('th')||'light';

 if(document.hidden&&window.Notification&&Notification.permission==='granted')new Notification('OpenTap',{body:t})}
function sheet(html,cls=''){const s=document.createElement('div');s.className='sheet';s.onclick=x=>x.target==s&&s.remove();s.innerHTML='<div class="'+cls+'">'+html+'</div>';document.body.appendChild(s);return s}
function ask(title,ph,type,cb){const s=sheet(`<b style="font-size:18px">${title}</b><input id="ak" type="${type}" placeholder="${ph}" autocomplete="off"><button style="width:100%;margin-top:8px" id="ako">Confirm</button>`);
 $('#ak').focus();$('#ako').onclick=()=>{const v=$('#ak').value;s.remove();cb(v)}}
async function upload(file){const p=`${me.id}/${Date.now()}-${file.name.replace(/[^\w.]/g,'_')}`;
 const {error}=await sb.storage.from('media').upload(p,file,{contentType:file.type,cacheControl:'31536000'});if(error){toast(error.message);return null}
 return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
const pick=acc=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>r(i.files[0]);i.click()});

// ---------- AUTH ----------
function authView(mode='in'){
 app.innerHTML=`<div class="auth"><div class="logo" style="font-size:52px">OpenTap</div><p class="mu" style="margin:8px 0 34px;font-size:14px">Tap. Share. Connect.</p>
 ${mode=='up'?'<input id="fn" placeholder="Nickname"><input id="un" placeholder="Username" autocapitalize="none">':''}
 <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)">
 <button style="width:100%;margin-top:12px;padding:14px" onclick="doAuth('${mode}')">${mode=='in'?'Log in':'Create account'}</button>
 <p class="mu" style="margin-top:22px;font-size:14px">${mode=='in'?'No account yet?':'Already have an account?'} <a href="#" style="color:#ff2e7e;font-weight:700;text-decoration:none" onclick="authView('${mode=='in'?'up':'in'}');return false">${mode=='in'?'Sign up':'Log in'}</a></p></div>`}
async function doAuth(m){const email=$('#em').value.trim(),password=$('#pw').value;let r;
 if(m=='up'){const username=$('#un').value.trim().toLowerCase().replace(/\W/g,'');if(!username)return toast('Please enter a username');

 else r=await sb.auth.signInWithPassword({email,password});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('Please confirm your email, then log in');

async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return authView();
 me=session.user;await loadProf();subscribe();heartbeat();go('feed')}
async function loadProf(){prof=(await sb.from('profiles').select('*').eq('id',me.id).single()).data}

function shell(title,body,right='',logo=false){app.style.paddingBottom='';app.innerHTML=`<div class="top">${logo?`<span class="brand"><i></i>Open<b>Tap</b></span>`:`<h1>${title}</h1>`}<span>${right}</span></div>${body}
<nav>${[['feed','home','Home'],['msg','chat','Chats'],['add','plus',''],['notif','bell','Activity'],['me','user','Profile']].map(([t,i,l])=>`<button class="${t=='add'?'add':tab==t?'on':''}" onclick="go('${t}')">${ic(i,t=='add'?24:23)}${l?`<span class="lb">${l}</span>`:''}${t=='notif'?`<span class="dot" id="nd" style="display:${unread?'block':'none'}">${unread}</span>`:''}</button>`).join('')}</nav>`}
function updDot(){const d=$('#nd');if(d){d.textContent=unread;d.style.display=unread?'block':'none'}}

// ---------- FEED ----------
const PQ='*,profiles!posts_user_id_fkey(id,username,full_name,avatar_url,verified),reactions(user_id,type),comments(count)';
async function feed(){shell('OpenTap','<div id="list"><p class="empty">Loading…</p></div>',`<button class="ib" onclick="go('search')">${ic('search',20)}</button>`,true);
 const {data,error}=await sb.from('posts').select(PQ).order('created_at',{ascending:false}).limit(40);
 if(error)return $('#list').innerHTML=`<p class="empty">${e(error.message)}</p>`;
 $('#list').innerHTML=data.length?data.map(postHTML).join(''):`<div class="empty">${ic('cam',54)}<b>No posts yet</b>Tap + below to share your first post</div>`}
function postHTML(p){const pr=p.profiles,mine=p.reactions.find(r=>r.user_id==me.id),n=p.reactions.length;reg(pr);
 const hb=!mine?ic('heart',26):mine.type=='❤️'?`<span style="color:#ff2e7e">${ic('heart',26,'currentColor')}</span>`:`<span style="font-size:24px;line-height:26px">${mine.type}</span>`;
 return `<div class="post" id="po${p.id}"><div class="ph" onclick="openP('${pr.id}')"><span class="ring">${av(pr)}</span><div><div class="nm">${nm(pr)}${vb(pr)}</div><div class="mu">${ago(p.created_at)}</div></div></div>
 <div class="mw">${p.media_type=='video'?`<video class="media" src="${e(p.media_url)}" controls playsinline></video>`:`<img class="media" src="${e(p.media_url)}" loading="lazy" ondblclick="react(${p.id},'❤️')">`}</div>
 <div class="act"><button class="p" onpointerdown="lpS(${p.id})" onpointerup="lpE()" onpointerleave="lpE()" oncontextmenu="return false" onclick="hClick(${p.id})">${hb}</button>
 <button class="p" onclick="comments(${p.id})">${ic('comment',25)}<small>${p.comments[0]?.count||0}</small></button><button class="p" onclick="share('${e(p.media_url)}')">${ic('share',24)}</button><button class="p" onclick="dl('${e(p.media_url)}')">${ic('dl',24)}</button>
 <span class="mu">${n?[...new Set(p.reactions.map(r=>r.type))].slice(0,3).join('')+' '+n:'Hold ♡ to react'}</span></div>
 ${p.caption?`<div class="cap"><b>${nm(pr)}</b> ${e(p.caption)}</div>`:''}</div>`}
let lpT,lpF;const lpS=(id,k='p')=>{lpF=0;lpT=setTimeout(()=>{lpF=1;rxPick(id,k)},420)},lpE=()=>clearTimeout(lpT),hClick=(id,k='p')=>{if(!lpF)react(id,'❤️',k)};
function rxPick(id,k='p'){document.querySelector('.rx')?.remove();const d=document.createElement('div');d.className='rx';
 d.innerHTML=['❤️','🔥','😂','😮','😢','👏'].map(x=>`<button onclick="react(${id},'${x}','${k}');this.parentNode.remove()">${x}</button>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
async function react(id,type,k='p'){const T=k=='c'?'comment_reactions':'reactions',F=k=='c'?'comment_id':'post_id';
 const cur=(await sb.from(T).select('type').eq(F,id).eq('user_id',me.id)).data[0];
 if(cur&&cur.type==type)await sb.from(T).delete().eq(F,id).eq('user_id',me.id);
 else if(cur)await sb.from(T).update({type}).eq(F,id).eq('user_id',me.id);
 else await sb.from(T).insert({[F]:id,user_id:me.id,type});
 k=='c'?loadC(curPost):refreshPost(id)}
async function refreshPost(id){const {data}=await sb.from('posts').select(PQ).eq('id',id).single();const el=$('#po'+id);if(el&&data)el.outerHTML=postHTML(data)}
async function dl(u){toast('Downloading…');try{const b=await(await fetch(u)).blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='opentap-'+(decodeURIComponent(u.split('/').pop().split('?')[0]).replace(/^\d+-/,'')||'file');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch{window.open(u,'_blank')}}
function share(u){navigator.share?navigator.share({title:'OpenTap',url:u}).catch(()=>{}):(navigator.clipboard?.writeText(u),toast('Link copied'))}
function comments(id){sheet(`<b style="font-size:18px">Comments</b><div id="cl" class="cl"></div><div id="rb" class="rb"></div><div class="cin"><textarea id="ci" class="ta" rows="1" placeholder="Add a comment…" oninput="grow(this)" onkeydown="kd(event,()=>sendC(${id}))"></textarea><button class="sd" onclick="sendC(${id})">${ic('up',22)}</button></div>`,'cmt');replyTo=null;loadC(id,true)}
async function loadC(id,end){curPost=id;const l0=$('#cl'),st=l0?l0.scrollTop:0;
 const {data}=await sb.from('comments').select('*,profiles!comments_user_id_fkey(id,username,full_name,avatar_url,verified),comment_reactions(user_id,type)').eq('post_id',id).order('created_at');
 const all=data||[];
 const item=(c,rep)=>{reg(c.profiles);const my=c.comment_reactions.find(r=>r.user_id==me.id),n=c.comment_reactions.length,root=c.parent_id||c.id;
  const hb=!my?ic('heart',18):my.type=='❤️'?`<span style="color:#ff2e7e">${ic('heart',18,'currentColor')}</span>`:`<span style="font-size:16px;line-height:18px">${my.type}</span>`;
  return `<div style="display:flex;gap:10px;padding:8px 0;${rep?'margin-left:42px':''}">${av(c.profiles,rep?'sm':'')}<div style="flex:1;min-width:0"><div class="nm" style="display:inline-flex">${nm(c.profiles)}${vb(c.profiles,13)}</div> <span style="white-space:pre-wrap;word-break:break-word">${e(c.body)}</span>
  <div class="mu" style="display:flex;gap:16px;margin-top:3px">${ago(c.created_at)}<b style="cursor:pointer" onclick="replyC(${root},'${c.profiles.id}')">Reply</b></div></div>
  <button class="p" style="align-self:flex-start;flex-direction:column;gap:0" onpointerdown="lpS(${c.id},'c')" onpointerup="lpE()" onpointerleave="lpE()" oncontextmenu="return false" onclick="hClick(${c.id},'c')">${hb}<small class="mu">${n||''}</small></button></div>`};
 $('#cl').innerHTML=all.filter(c=>!c.parent_id).map(c=>item(c,0)+all.filter(r=>r.parent_id==c.id).map(r=>item(r,1)).join('')).join('')||'<p class="mu" style="padding:14px 0">No comments yet. Be the first to comment.</p>';
 const l=$('#cl');l.scrollTop=end?l.scrollHeight:st}
function replyC(root,uid){replyTo={id:root,uid};const rb=$('#rb');rb.style.display='block';rb.innerHTML=`Replying to <b>${nm(PM[uid])}</b> · <span style="cursor:pointer;text-decoration:underline" onclick="cancelR()">Cancel</span>`;const t=$('#ci');t.focus()}
function cancelR(){replyTo=null;$('#rb').style.display='none'}
async function sendC(id){const b=$('#ci').value.trim();if(!b)return;const {error}=await sb.from('comments').insert({post_id:id,user_id:me.id,body:b,parent_id:replyTo?replyTo.id:null});if(error)return toast(error.message);$('#ci').value='';$('#ci').style.height='auto';cancelR();loadC(id,true);refreshPost(id)}

// ---------- UPLOAD ----------
function add(){shell('New post',`<div class="pad"><div id="pv" class="post" style="margin:0 0 14px;min-height:240px;display:grid;place-items:center;border:2px dashed var(--bd);box-shadow:none;cursor:pointer" onclick="choose()"><div class="mu" style="text-align:center">${ic('cam',44)}<br>Select a photo or video</div></div>
 <div class="mu" id="hd" style="margin:-4px 4px 10px">HD · original quality, no compression</div><textarea id="cap" rows="3" placeholder="Write a caption…"></textarea><button id="pb" style="width:100%;padding:14px;margin-top:6px" onclick="publish()">Share post</button></div>`)}
let file;async function choose(){file=await pick('image/*,video/*');if(!file)return;const u=URL.createObjectURL(file);
 $('#pv').style.border='0';$('#pv').innerHTML=file.type.startsWith('video')?`<video class="media" src="${u}" controls></video>`:`<img class="media" src="${u}">`;$('#hd').textContent='HD · original quality · '+(file.size/1048576).toFixed(1)+' MB'}
async function publish(){if(!file)return toast('Select a file first');$('#pb').textContent='Uploading…';$('#pb').disabled=true;
 const url=await upload(file);if(!url){$('#pb').disabled=false;$('#pb').textContent='Share post';return}
 const {error}=await sb.from('posts').insert({user_id:me.id,media_url:url,media_type:file.type.startsWith('video')?'video':'image',caption:$('#cap').value});
 file=null;error?toast(error.message):go('feed')}

// ---------- MESSAGES ----------
async function msg(){shell('Messages','<div class="pad"><div style="position:relative"><input id="sq" placeholder="Search people…" oninput="srch(this.value)" style="padding-left:44px"><span style="position:absolute;left:14px;top:19px;color:var(--mu)">'+ic('search',18)+'</span></div></div><div id="ml" style="margin-top:8px"></div>');srch('')}
async function srch(q){q=q.trim().replace(/[%,()]/g,'');let r=sb.from('profiles').select('*').neq('id',me.id).limit(30);if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);const {data}=await r;
 $('#ml').innerHTML=(data||[]).map(p=>`<div class="row" onclick="chat('${reg(p)}')"><span class="ring">${av(p)}</span><div><div class="nm">${nm(p)}${vb(p)}</div><div class="mu"><span class="od ${online(p)?'':'off'}"></span>${online(p)?'Active now':'Last seen '+ago(p.last_seen)}</div></div></div>`).join('')||'<p class="empty">No users found</p>'}
async function chat(id){const p=PM[id];chatWith=p;app.style.paddingBottom='0';app.innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="ib" onclick="go('msg')">${ic('back')}</button><span class="ring">${av(p)}</span><div><div class="nm">${nm(p)}${vb(p)}</div><div class="mu"><span class="od ${online(p)?'':'off'}"></span>${online(p)?'Online':'Offline'}</div></div></div></div>
 <div id="cm" class="pad" style="min-height:70vh"></div>
 <div class="chatbar"><div><button class="cb" onclick="sendMedia()">${ic('img',24)}</button><textarea id="mi" class="ta" rows="1" placeholder="Message…" oninput="grow(this)" onkeydown="kd(event,sendT)"></textarea><button class="cb" id="mic" onclick="rec()">${ic('mic',24)}</button><button class="sd" onclick="sendT()">${ic('up',22)}</button></div></div>`;
 const {data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${me.id})`).order('created_at');
 $('#cm').innerHTML='';data.forEach(addBub);scrollEnd()}
function addBub(m){const mine=m.sender_id==me.id;let c=e(m.body||'');
 if(m.media_type=='image')c=`<img src="${e(m.media_url)}">`;else if(m.media_type=='video')c=`<video src="${e(m.media_url)}" controls playsinline></video>`;else if(m.media_type=='audio')c=`<audio src="${e(m.media_url)}" controls></audio>`;
 if(m.media_type=='image'||m.media_type=='video')c+=`<div><button class="dlb" onclick="dl('${e(m.media_url)}')">${ic('dl',15)}Save</button></div>`;
 $('#cm').insertAdjacentHTML('beforeend',`<div class="bub ${mine?'me':'th'}">${c}<div style="opacity:.6;font-size:10px;margin-top:2px">${ago(m.created_at)}</div></div>`)}
const scrollEnd=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
async function sendRaw(o){const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:chatWith.id,...o}).select().single();if(error)return toast(error.message);addBub(data);scrollEnd()}
function sendT(){const b=$('#mi').value.trim();if(!b)return;$('#mi').value='';$('#mi').style.height='auto';sendRaw({body:b})}
async function sendMedia(){const f=await pick('image/*,video/*');if(!f)return;toast('Sending…');const u=await upload(f);u&&sendRaw({media_url:u,media_type:f.type.startsWith('video')?'video':'image'})}
let mr,chunks=[];async function rec(){const b=$('#mic');
 if(mr&&mr.state=='recording'){mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);chunks=[];mr.ondataavailable=x=>chunks.push(x.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());b.innerHTML=ic('mic',26);b.style.color='var(--mu)';const bl=new Blob(chunks,{type:mr.mimeType});const ext=mr.mimeType.includes('mp4')?'m4a':'webm';
   const u=await upload(new File([bl],'voice.'+ext,{type:mr.mimeType}));u&&sendRaw({media_url:u,media_type:'audio'})};
  mr.start();b.innerHTML=ic('stop',26);b.style.color='#ff2e7e';toast('Recording… tap stop to send')}catch{toast('Please allow microphone access')}}

// ---------- SEARCH ----------
function searchPage(){shell('Search',`<div class="pad"><div style="position:relative"><input id="sq2" placeholder="Search by username or name" oninput="srch2(this.value)" style="padding-left:44px" autocomplete="off" autocapitalize="none"><span style="position:absolute;left:14px;top:19px;color:var(--mu)">${ic('search',18)}</span></div></div><div id="sl" style="margin-top:8px"></div>`);$('#sq2').focus();srch2('')}
async function srch2(q){q=q.trim().replace(/[%,()]/g,'');let r=sb.from('profiles').select('*').limit(30);if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);const {data}=await r;
 $('#sl').innerHTML=(data||[]).map(p=>`<div class="row" onclick="openP('${reg(p)}')">${av(p)}<div><div class="nm">${nm(p)}${vb(p)}</div><div class="mu">@${e(p.username)}</div></div></div>`).join('')||'<p class="empty">No users found</p>'}
// ---------- NOTIFICATIONS ----------
async function notif(){unread=0;shell('Activity','<div id="nl"></div>');
 const {data}=await sb.from('notifications').select('*,profiles:actor_id(username,full_name,avatar_url,verified)').order('created_at',{ascending:false}).limit(50);
 $('#nl').innerHTML=(data||[]).map(n=>(NM[n.id]=n,`<div class="row" onclick="openNotif(NM[${n.id}])">${av(n.profiles)}<div><span class="nm" style="display:inline-flex">${nm(n.profiles)}${vb(n.profiles)}</span> ${e(n.text)}<div class="mu">${ago(n.created_at)}</div></div></div>`)).join('')||`<div class="empty">${ic('bell',50)}<b>No notifications yet</b></div>`}
async function openNotif(n){if(n.type=='message'){const {data}=await sb.from('profiles').select('*').eq('id',n.actor_id).single();if(data){tab='msg';chat(reg(data))}}else if(n.post_id)openPost(n.post_id,n.type=='comment'||n.type=='reply')}
async function openPost(id,withC){tab='';const {data}=await sb.from('posts').select(PQ).eq('id',id).single();
 shell('Post',data?postHTML(data):'<p class="empty">This post is no longer available</p>',`<button class="ib" onclick="go('notif')">${ic('back',20)}</button>`);if(data&&withC)comments(id)}
function subscribe(){chan.forEach(c=>sb.removeChannel(c));
 chan=[sb.channel('n'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},async x=>{
   const n=x.new,a=(await sb.from('profiles').select('username,full_name').eq('id',n.actor_id).single()).data;
   if(n.type=='message'&&chatWith&&chatWith.id==n.actor_id)return;
   toast(`${(a?.full_name||a?.username||'Someone')} ${n.text}`,()=>openNotif(n));if(tab=='notif')notif();else{unread++;updDot()}}).subscribe(),
  sb.channel('m'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'receiver_id=eq.'+me.id},x=>{if(chatWith&&chatWith.id==x.new.sender_id){addBub(x.new);scrollEnd()}}).subscribe(),
  sb.channel('p').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>{if(tab=='feed')toast('New post available — refresh your feed')}).subscribe()]}

// ---------- PROFILE ----------
async function profile(uid){const own=uid==me.id;
 const [{data:p},{data:ps}]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).single(),sb.from('posts').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);
 reg(p);window.PS=ps;
 shell(own?'Profile':'@'+e(p.username),`<div class="pcard"><span class="ring" style="display:inline-block">${av(p,'big')}</span>
 <div class="nm" style="justify-content:center;font-size:21px;margin-top:8px">${nm(p)}${vb(p,18)}</div><div class="mu" style="font-size:14px">@${e(p.username)}</div>
 <div class="mu" style="margin-top:4px"><span class="od ${own||online(p)?'':'off'}"></span>${own||online(p)?'Active now':'Last seen '+ago(p.last_seen)}</div>
 ${p.bio?`<p style="margin:12px 0 0;white-space:pre-wrap">${e(p.bio)}</p>`:''}
 <div class="stats"><div><b>${ps.length}</b><span class="mu">Posts</span></div><div><b>${ps[0]?ago(ps[0].created_at):'—'}</b><span class="mu">Last post</span></div></div>
 ${own?`<button class="g" style="width:100%" onclick="editP()">Edit profile</button>`:`<button style="width:100%" onclick="chat('${p.id}')">Message</button>`}</div>
 ${ps.length?`<div class="grid">${ps.map((x,i)=>`<div onclick="viewM(${i})">${x.media_type=='video'?`<video src="${e(x.media_url)}#t=0.1" muted playsinline></video>`:`<img src="${e(x.media_url)}" loading="lazy">`}<span>${new Date(x.created_at).toLocaleDateString()}</span></div>`).join('')}</div>`:`<div class="empty">${ic('cam',44)}<b>No posts yet</b></div>`}`,own?`<button class="ib" onclick="go('settings')">${ic('sl',20)}</button>`:'')}
function viewM(i){const x=PS[i];sheet(`${x.media_type=='video'?`<video class="media" style="border-radius:16px" src="${e(x.media_url)}" controls playsinline></video>`:`<img class="media" style="border-radius:16px" src="${e(x.media_url)}">`}<p style="margin-top:10px">${e(x.caption)}</p><p class="mu">${new Date(x.created_at).toLocaleString()}</p><button class="g" style="width:100%;margin-top:10px;display:flex;justify-content:center;gap:8px" onclick="dl('${e(x.media_url)}')">${ic('dl',20)}Download original</button>`)}
function editP(){tab='me';shell('Edit profile',`<div class="pad"><div style="text-align:center;margin:6px 0 14px"><span class="ring" style="display:inline-block">${av(prof,'big').replace('class="av big"','class="av big" id="eav"')}</span><br><button class="g" style="margin-top:10px" onclick="chAv()">Change photo</button></div>
 <label class="mu">Nickname</label><input id="en" value="${e(prof.full_name)}"><label class="mu">Username</label><input id="eu" value="${e(prof.username)}" autocapitalize="none"><label class="mu">Bio</label><textarea id="eb" rows="3">${e(prof.bio)}</textarea>
 <div class="grp" style="margin:12px 0"><div class="sw"><span>Get verified ${prof.verified?bd(16):''}</span>${prof.verified?'<span class="mu">Verified</span>':'<button class="g" onclick="verify()">Enter code</button>'}</div></div>
 <button style="width:100%;padding:14px" onclick="saveP()">Save changes</button><button class="g" style="width:100%;margin-top:8px" onclick="go('me')">Cancel</button></div>`)}
async function chAv(){const f=await pick('image/*');if(!f)return;toast('Uploading…');const u=await upload(f);if(u){prof.avatar_url=u;$('#eav').src=u}}
async function saveP(){const {error}=await sb.from('profiles').update({username:$('#eu').value.trim().toLowerCase().replace(/\W/g,''),full_name:$('#en').value.trim(),bio:$('#eb').value,avatar_url:prof.avatar_url}).eq('id',me.id);
 if(error)return toast(error.message);await loadProf();go('me')}
function verify(){ask('Verification code','Enter code','text',async c=>{if(!c.trim())return;const {data,error}=await sb.rpc('verify_me',{code:c.trim()});
 if(error)return toast('Error: '+error.message);if(data){toast('You are now verified');await loadProf();editP()}else toast('Incorrect code. Please try again')})}

// ---------- SETTINGS ----------
function settings(){tab='me';const d=document.documentElement.dataset.theme=='dark';
 shell('Settings',`<div class="grp"><div class="sw"><span style="display:flex;gap:12px;align-items:center">${ic('moon')}Dark mode</span><button class="tg ${d?'on':''}" onclick="dark(this)"></button></div>
 <div class="sw"><span style="display:flex;gap:12px;align-items:center">${ic('bell')}Push notifications</span><button class="g" onclick="Notification.requestPermission().then(r=>toast('Notifications: '+r))">Allow</button></div></div>
 <div class="grp"><div class="sw"><span class="mu" style="font-size:14px">${e(me.email)}</span></div>
 <div class="sw"><span style="display:flex;gap:12px;align-items:center">${ic('lock')}Password</span><button class="g" onclick="pw()">Change</button></div></div>
 <div class="grp"><div class="sw" onclick="out()" style="cursor:pointer;color:#e0245e;font-weight:700"><span style="display:flex;gap:12px;align-items:center">${ic('out')}Log out</span></div></div>
 <div style="padding:0 12px"><button class="g" style="width:100%" onclick="go('me')">Back to profile</button></div>`)}
function dark(b){const on=!b.classList.contains('on');b.classList.toggle('on',on);const t=on?'dark':'light';document.documentElement.dataset.theme=t;LS.setItem('th',t)}
function pw(){ask('New password','Min 6 characters','password',async p=>{if(!p)return;const {error}=await sb.auth.updateUser({password:p});toast(error?error.message:'Password changed')})}
function out(){sb.auth.signOut().then(()=>{chan.forEach(c=>sb.removeChannel(c));authView()})}
const grow=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'};
const kd=(ev,fn)=>{if(ev.key=='Enter'&&!ev.shiftKey&&!matchMedia('(pointer:coarse)').matches){ev.preventDefault();fn()}};
let ly=0;addEventListener('scroll',()=>{const t=$('.top'),y=scrollY;if(t&&!chatWith){if(y>ly+8&&y>70)t.classList.add('hide');else if(y<ly-8||y<70)t.classList.remove('hide')}ly=y},{passive:true});
addEventListener('beforeunload',()=>me&&sb.from('profiles').update({last_seen:new Date(0).toISOString()}).eq('id',me.id));
if(SB_URL.startsWith('YOUR'))app.innerHTML='<div class="auth"><div class="logo" style="font-size:44px">OpenTap</div><p style="margin-top:24px">Add your <b>SB_URL</b> and <b>SB_KEY</b> at the top of this file.</p></div>';else boot();
</script></body></html>
